[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brightpath-ai"
version = "0.1.0"
description = "Portfolio simulation for consumer finance decision support"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0", "numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3",
  "joblib>=1.3", "fastapi>=0.110", "uvicorn[standard]>=0.27",
  "pydantic>=2.6", "streamlit>=1.32", "requests>=2.31"
]

[project.optional-dependencies]
data = ["ucimlrepo>=0.0.7"]
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["brightpath*", "backend*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
